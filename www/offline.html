<!doctype html>
<!-- Shown when https://logitory.io/login/ can't be loaded (no connection, or the site is down):
     capacitor.config.json server.errorPath. Try Again reloads the app. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logitory</title>
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: #e2e8f0;
        --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1120;
          --card: #111827;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --border: #1e293b;
          --accent: #6366f1;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
      button {
        margin-top: 24px;
        width: 100%;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="icon.png" alt="Logitory" />
      <h1>Can’t reach Logitory</h1>
      <p>Check that your phone is online, then try again.</p>
      <button type="button" onclick="location.href = 'https://logitory.io/login/'">Try Again</button>
    </main>
  </body>
</html>
